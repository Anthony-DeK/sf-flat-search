name: prune

on:
  schedule:
    # Sundays 10:23 UTC (~3am Pacific), in the gap between scans.
    - cron: "23 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan   # shares state with the scan workflow; never run both at once
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Remove listings that are no longer online
        run: python -m scraper.prune
      - name: Commit state
        run: |
          git config user.name "apartment-bot"
          git config user.email "apartment-bot@users.noreply.github.com"
          git add data docs/listings.json
          git diff --cached --quiet || (git commit -m "prune $(date -u +%FT%TZ)" && git pull --rebase -X theirs origin main && git push)
